version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: andaman_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  supabase-kong:
    image: kong:3.4-alpine
    container_name: andaman_kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: postgres
      KONG_PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KONG_PG_DATABASE: postgres
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"   # API gateway
      - "8001:8001"   # Admin API
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  supabase-auth:
    image: supabase/auth:latest
    container_name: andaman_auth
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_ENABLE_SIGNUP: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_TEMPLATES_DEFAULT_FROM_NAME: "AndamanBazaar"
      GOTRUE_MAILER_TEMPLATES_DEFAULT_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@andamanbazaar.in}
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION_URI: ${SITE_URL:-http://localhost:3000}/auth?confirm=%s
      GOTRUE_MAILER_TEMPLATES_RECOVERY_URI: ${SITE_URL:-http://localhost:3000}/reset-password?token=%s
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_MAX_FREQUENCY: "1s"
    ports:
      - "9999:9999"   # Debug port (optional)
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  supabase-storage:
    image: supabase/storage-api:latest
    container_name: andaman_storage
    environment:
      STORAGE_PGBOUNCER_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      STORAGE_JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this}
      STORAGE_REGION: auto
      STORAGE_S3_PROTOCOL: s3
      STORAGE_S3_BUCKET: storage
      STORAGE_S3_ENDPOINT: minio:9000
      STORAGE_S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      STORAGE_S3_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      STORAGE_S3_FORCE_PATH_STYLE: "true"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: andaman_minio
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    restart: unless-stopped

  realtime:
    image: supabase/realtime:latest
    container_name: andaman_realtime
    environment:
      REALTIME_PG_CHANGES_PUBLISH_INTERVAL: 100
      REALTIME_SLOT_NAME: realtime_changes
      DB_HOST: postgres
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this}
      JWT_AUD: authenticated
      ADMIN_JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    name: andaman_network
